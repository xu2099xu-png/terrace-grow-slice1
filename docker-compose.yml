services:
  postgres:
    image: postgres:16-alpine
    container_name: terrace-grow-postgres
    environment:
      POSTGRES_USER: terrace
      POSTGRES_PASSWORD: terrace
      POSTGRES_DB: terrace_grow
    ports:
      - "5433:5432"
    volumes:
      - terrace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrace -d terrace_grow"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  terrace_pgdata:
